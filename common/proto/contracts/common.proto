syntax = "proto3";

package common;

import "google/protobuf/timestamp.proto";

message SatelliteIdentifier {
    oneof kind {
        uint32 norad_id = 1;
        string satellite_name = 2;
    }
}

message TimeRange {
    google.protobuf.Timestamp start = 1;
    google.protobuf.Timestamp end = 2;
}

message SamplingOptions {
    uint32 step_seconds = 1;
}

message Vector3 {
    double x = 1;
    double y = 2;
    double z = 3;
}

message GeodeticInput {
    oneof lat {
        double lat_deg = 1;
        double lat_rad = 2;
    }
    oneof lon {
        double lon_deg = 3;
        double lon_rad = 4;
    }
    oneof alt {
        double alt_m = 5;
        double alt_km = 6;
    }
}

message GeodeticOutput {
    double lat = 1;
    double lon = 2;
    double alt = 3;
}

message UnitSettings {
    enum DistanceUnit {
        DISTANCE_UNIT_UNSPECIFIED = 0;
        DISTANCE_UNIT_METERS = 1;
        DISTANCE_UNIT_KILOMETERS = 2;
        DISTANCE_UNIT_MILES = 3;
    }
    enum AngleUnit {
        ANGLE_UNIT_UNSPECIFIED = 0;
        ANGLE_UNIT_DEGREES = 1;
        ANGLE_UNIT_RADIANS = 2;
    }
    DistanceUnit distance_unit = 1;
    AngleUnit angle_unit = 2;
}
