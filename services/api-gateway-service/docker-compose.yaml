services:
  api-gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - orbitalik-net
    ports:
      - "8080:${HTTP_PORT}"
    env_file:
      - .env
    labels:
      prometheus.scrape: "true"
      prometheus.port: "${HTTP_PORT}"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${HTTP_PORT}/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
