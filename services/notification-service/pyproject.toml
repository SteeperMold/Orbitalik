[project]
name = "notification-service"
version = "0.1.0"
description = "Orbitalik notification service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.138.1",
    "grpcio>=1.81.1",
    "grpcio-tools>=1.81.1",
    "logging>=0.4.9.6",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*_pb2.py",
    "*_pb2_grpc.py",
    "**/proto/**",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific rules
    "PL",
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
